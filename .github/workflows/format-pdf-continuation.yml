name: Format PDF continuation

on:
  push:
    branches:
      - chatgpt/pdfkit-renderer

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/pdfkit-renderer
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format continuation changes
        run: |
          pnpm exec prettier --write             apps/web/app/globals.css             apps/web/features/analytics/charts.tsx             apps/web/features/analytics/analytics.tsx             apps/web/features/dashboard/overview.tsx             apps/api/src/reports/reports.service.ts             apps/api/src/reports/pdf-renderer.ts
      - name: Commit formatting and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-pdf-continuation.yml
          git add -A
          git commit -m "style: format completion changes"
          git push origin HEAD:chatgpt/pdfkit-renderer
