name: One-time final formatting

on:
  push:
    branches:
      - 'chatgpt/todo-final*'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed source and docs
        run: |
          pnpm exec prettier --write             apps/api/src/reports/reports.service.ts             apps/api/src/reports/pdf-renderer.ts             apps/api/scripts/prepare-test-database.ts             apps/api/scripts/run-integration.ts             apps/web/app/globals.css             apps/web/postcss.config.mjs             apps/web/features/analytics/charts.tsx             apps/web/features/analytics/analytics.tsx             apps/web/features/dashboard/overview.tsx             README.md TODO.md BLOCKERS.md             docs
      - name: Commit formatting and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-final.yml
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format completed TODO changes"
          git push origin HEAD:${{ github.ref_name }}
