name: TODO completion verification

on:
  push:
    branches:
      - chatgpt/todo-completion
      - chatgpt/pdfkit-renderer

permissions:
  contents: read

concurrency:
  group: todo-completion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      APP_ORIGIN: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm test:db:prepare
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - name: Verify isolated backup and restore
        shell: bash
        run: |
          set -euo pipefail
          source apps/api/.test-database
          SOURCE_DATABASE_URL="$DATABASE_URL"
          NATIVE_DATABASE_URL="${SOURCE_DATABASE_URL%%\?*}"
          export PGPASSWORD=postgres
          RESTORE_DB="smd_restore_ci"
          dropdb -h 127.0.0.1 -U postgres --if-exists "$RESTORE_DB"
          pg_dump --format=custom --file=/tmp/smd-backup.dump "$NATIVE_DATABASE_URL"
          createdb -h 127.0.0.1 -U postgres "$RESTORE_DB"
          pg_restore --exit-on-error -h 127.0.0.1 -U postgres -d "$RESTORE_DB" /tmp/smd-backup.dump
          SOURCE_CAMPAIGNS="$(psql "$NATIVE_DATABASE_URL" -Atc 'SELECT count(*) FROM "social_media_dashboard"."Campaign";')"
          RESTORE_CAMPAIGNS="$(psql -h 127.0.0.1 -U postgres -d "$RESTORE_DB" -Atc 'SELECT count(*) FROM "social_media_dashboard"."Campaign";')"
          SOURCE_RECORDS="$(psql "$NATIVE_DATABASE_URL" -Atc 'SELECT count(*) FROM "social_media_dashboard"."PerformanceRecord";')"
          RESTORE_RECORDS="$(psql -h 127.0.0.1 -U postgres -d "$RESTORE_DB" -Atc 'SELECT count(*) FROM "social_media_dashboard"."PerformanceRecord";')"
          test "$SOURCE_CAMPAIGNS" = "$RESTORE_CAMPAIGNS"
          test "$SOURCE_RECORDS" = "$RESTORE_RECORDS"
          dropdb -h 127.0.0.1 -U postgres "$RESTORE_DB"

      - uses: grafana/setup-k6-action@v1
      - run: pnpm --filter @smd/api test:load

      - run: pnpm format:docs
